<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Home Base TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
:root { --bg:#0E1412; --bg2:#16201C; --ink:#EEF2EF; --ink2:#A9B6B0; --accent:#6DC2A4; --gold:#F0B43C; --glowA:rgba(109,194,164,.24); --glowG:rgba(240,180,60,.14);
  --haloA:rgba(109,194,164,.45); --haloG:rgba(240,180,60,.38);
  --card:rgba(30,40,36,.72); --line:rgba(255,255,255,.08); --row:30vh;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif; --f-holiday:var(--f-display); --f-holiday-w:700; color-scheme:dark }
html, body { margin:0; height:100%; overflow:hidden; cursor:none }
body { background:radial-gradient(130vh 95vh at 8% -10%, var(--glowA), transparent 70%), radial-gradient(110vh 85vh at 100% 35%, var(--glowG), transparent 70%), linear-gradient(180deg, var(--bg2), var(--bg) 75%);
  background-color:var(--bg); color:var(--ink); font-family:var(--f-body); opacity:0; transition:opacity .5s ease }
body.ready { opacity:1 }
/* Slow glowing light drifting behind everything (big soft gradients moved with transforms, which the TV box handles easily). */
#glow { position:fixed; inset:0; pointer-events:none; overflow:hidden }
#glow i { position:absolute; border-radius:50%; will-change:transform; opacity:.9 }
#glow .g1 { width:95vh; height:95vh; left:-20vh; top:-30vh; background:radial-gradient(closest-side, var(--glowA), transparent); animation:tv-drift1 70s ease-in-out infinite alternate }
#glow .g2 { width:85vh; height:85vh; right:-18vh; top:18vh; background:radial-gradient(closest-side, var(--glowG), transparent); animation:tv-drift2 85s ease-in-out infinite alternate }
#glow .g3 { width:70vh; height:70vh; left:38vw; bottom:-35vh; background:radial-gradient(closest-side, var(--glowA), transparent); opacity:.55; animation:tv-drift3 95s ease-in-out infinite alternate }
@keyframes tv-drift1 { from { transform:translate(0,0) scale(1) } to { transform:translate(22vw,14vh) scale(1.18) } }
@keyframes tv-drift2 { from { transform:translate(0,0) scale(1.1) } to { transform:translate(-26vw,-10vh) scale(.9) } }
@keyframes tv-drift3 { from { transform:translate(0,0) } to { transform:translate(-18vw,-12vh) } }
#pat { position:fixed; inset:0; background-image:var(--pat, none); background-size:48vh 48vh; opacity:.08; pointer-events:none }
#fade { position:fixed; left:0; right:0; bottom:0; height:calc(var(--row) + 8vh); background:linear-gradient(180deg, transparent, rgba(0,0,0,.5)); pointer-events:none }
body.saver #fade { display:none }
/* Rising motes. The glow is painted into the dot itself (a soft gradient), and the whole path, sway included, is one
   transform, so the TV box's graphics chip moves them without redrawing or re-laying out the page every frame. */
#motes { position:fixed; inset:0; pointer-events:none; overflow:hidden; contain:strict }
#motes i { position:absolute; bottom:-6vh; border-radius:50%; background:radial-gradient(circle, var(--c) 0 7%, color-mix(in srgb, var(--c) 45%, transparent) 16%, color-mix(in srgb, var(--c) 14%, transparent) 38%, transparent 70%);
  opacity:0; will-change:transform, opacity; animation:tv-rise linear infinite }
@keyframes tv-rise { 0% { transform:translate3d(0,0,0); opacity:0 } 10% { opacity:.65 } 30% { transform:translate3d(1.4vw,-33vh,0) }
  55% { transform:translate3d(-1.2vw,-60vh,0) } 80% { transform:translate3d(1vw,-88vh,0); opacity:.45 } 100% { transform:translate3d(-.6vw,-112vh,0); opacity:0 } }
#wrap { position:fixed; left:0; right:0; top:0; bottom:var(--row); padding:6.5vh 5.5vw 2vh; box-sizing:border-box; display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 0.92fr); gap:4vw; transition:transform 6s ease }
body.saver #wrap { bottom:22vh; padding:9vh 7vw 2vh }
.left { display:flex; flex-direction:column; min-width:0 }
#clock { font:700 16vh/.9 var(--f-display); letter-spacing:-.035em; font-variant-numeric:tabular-nums; white-space:nowrap; text-shadow:0 0 5vh var(--haloA), 0 0 1.2vh rgba(255,255,255,.12) }
body.saver #clock { font-size:21vh }
#clock .ap { font-size:.27em; margin-left:.35em; font-weight:600; letter-spacing:.06em; color:var(--ink2); text-shadow:none }
#date { font:var(--f-holiday-w) 4.6vh/1.15 var(--f-holiday); color:var(--accent); margin-top:2vh; text-shadow:0 0 3vh var(--haloA) }
#wx { display:flex; align-items:center; gap:1.8vh; margin-top:3.4vh; color:var(--ink2); font-size:2.6vh; line-height:1.3 }
#wx > svg { width:7vh; height:7vh; color:var(--gold); flex:none; filter:drop-shadow(0 0 1.6vh var(--haloG)) }
#wx b { display:block; font:700 5.2vh/1 var(--f-display); color:var(--ink) }
/* In the screensaver, with photos on the right, the next thing on the calendar moves under the weather. */
#next { display:none; position:relative; margin-top:4.5vh; padding-left:2.4vh }
#next::before { content:''; position:absolute; left:0; top:.4vh; bottom:.4vh; width:.7vh; border-radius:1vh; background:var(--c, var(--accent)); box-shadow:0 0 1.8vh .2vh var(--c, var(--accent)) }
#next:empty { display:none !important }
body.photos #next { display:block }
#next .when { font-size:2.3vh; color:var(--gold); font-weight:700; font-variant-numeric:tabular-nums }
#next .what { font:700 3.6vh/1.2 var(--f-display); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:.3vh }
.right { position:relative; min-width:0; align-self:start; background:var(--card); border:1px solid var(--line); border-radius:3vh; padding:3.2vh 3.4vh 2.4vh;
  box-shadow:0 2vh 6vh rgba(0,0,0,.25), 0 0 7vh -1vh var(--glowA), inset 0 1px 0 rgba(255,255,255,.06) }
/* A thin glowing edge along the top of the card. */
.right::before { content:''; position:absolute; left:8%; right:8%; top:-1px; height:2px; border-radius:2px; background:linear-gradient(90deg, transparent, var(--accent), var(--gold), transparent); opacity:.75; box-shadow:0 0 1.6vh var(--haloA) }
/* On a busy day the card stops above the app row instead of running behind it. */
body.home .right { max-height:100%; box-sizing:border-box; overflow:hidden }
.lbl { font-size:1.8vh; letter-spacing:.16em; text-transform:uppercase; color:var(--ink2); font-weight:700 }
#up { margin-top:1vh }
.ev { display:grid; grid-template-columns:.7vh minmax(0, 1fr); gap:1.8vh; padding:1.5vh 0; border-bottom:1px solid var(--line) }
.ev:last-child { border-bottom:0 }
.ev i { position:relative; border-radius:1vh; background:var(--c) }
.ev.first i { box-shadow:0 0 1.6vh .2vh var(--c) }
/* "Happening now" breathes by fading a ready-made glow in and out (opacity only, nothing redrawn each frame). */
.ev.now i::after { content:''; position:absolute; inset:0; border-radius:inherit; box-shadow:0 0 2.8vh .6vh var(--c); opacity:0; will-change:opacity; animation:tv-breathe 3.2s ease-in-out infinite }
@keyframes tv-breathe { 50% { opacity:1 } }
.ev .when { font-size:2.3vh; color:var(--gold); font-weight:700; font-variant-numeric:tabular-nums }
.ev .what { font:700 3.2vh/1.2 var(--f-display); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:.3vh }
.ev.first .what { font-size:4vh }
.none { margin:1.6vh 0 .6vh; font-size:2.7vh; color:var(--ink2) }
#dinner, #chores { display:flex; align-items:baseline; gap:1.6vh; margin-top:1.6vh; font-size:2.6vh; min-width:0 }
#dinner:empty, #chores:empty { display:none }
#dinner .dn { font:700 3.2vh/1.2 var(--f-display); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
#chores { color:var(--ink2) } #chores b { color:var(--ink) }
.right > .lbl:first-child { display:block }
/* Screensaver slideshow: takes the right side in place of Up next when there are photos. Each photo sits whole on a
   blurred, darkened copy of itself, drifts in very slowly, and fades into the next. */
#photo { display:none; position:relative; min-width:0; height:62vh; align-self:start; border-radius:3vh; overflow:hidden; background:#000;
  box-shadow:0 2vh 6vh rgba(0,0,0,.45), 0 0 9vh -1vh var(--haloA), 0 0 0 1px rgba(255,255,255,.1) }
body.photos .right { display:none }
body.photos #photo { display:block }
#photo .ph { position:absolute; inset:0; opacity:0; transition:opacity 2s ease }
#photo .ph.show { opacity:1 }
#photo .bk { position:absolute; inset:-6%; background-size:cover; background-position:center; filter:blur(4vh) brightness(.55) saturate(1.2) }
/* With a pre-shrunk copy of the photo, stretching it up already looks blurred, so no live blur filter is needed. */
#photo .bk.soft { filter:none; inset:0; image-rendering:auto }
#photo .bk.soft::after { content:''; position:absolute; inset:0; background:rgba(0,0,0,.45) }
#photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; transform:scale(1); transition:transform 18s linear }
#photo .ph.show img { transform:scale(1.06) }
#photo::after { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08), inset 0 -10vh 8vh -8vh rgba(0,0,0,.35) }
#lane { position:fixed; left:5vw; width:42vw; bottom:calc(var(--row) - 1vh); height:22vh; pointer-events:none; z-index:2 }
body.saver #lane { bottom:3vh; height:20vh; left:6vw; right:6vw }
#lane .hero-pace { height:100%; bottom:0 }
.hero-visit { z-index:3 }
/* ---------- motion polish ----------
   Everything here moves only transform and opacity, the two things the TV box can animate smoothly. */
:root { --ease-out:cubic-bezier(.16,1,.3,1); --ease-io:cubic-bezier(.65,0,.35,1) }
/* Theme changes from the wall fade in over a second instead of snapping. */
@property --bg { syntax:'<color>'; inherits:true; initial-value:#0E1412 }
@property --bg2 { syntax:'<color>'; inherits:true; initial-value:#16201C }
@property --accent { syntax:'<color>'; inherits:true; initial-value:#6DC2A4 }
@property --gold { syntax:'<color>'; inherits:true; initial-value:#F0B43C }
:root { transition:--bg 1.2s var(--ease-io), --bg2 1.2s var(--ease-io), --accent 1.2s var(--ease-io), --gold 1.2s var(--ease-io) }
/* Opening: the clock, date and weather rise in one after another, then the card. */
body { transition:opacity .35s var(--ease-out) }
.left > *, .right, #photo { opacity:0; transform:translate3d(0,2.4vh,0); transition:opacity .7s var(--ease-out), transform .9s var(--ease-out) }
body.ready .left > *, body.ready .right, body.ready #photo { opacity:1; transform:none }
body.ready #date { transition-delay:.07s } body.ready #wx { transition-delay:.14s } body.ready #next { transition-delay:.2s }
body.ready .right, body.ready #photo { transition-delay:.18s }
/* New calendar rows slide in, staggered; rows already showing stay put. */
.ev.in { animation:tv-row .6s var(--ease-out) both; animation-delay:calc(var(--n, 0) * 70ms) }
@keyframes tv-row { from { opacity:0; transform:translate3d(2.6vh,0,0) } to { opacity:1; transform:none } }
.swap { animation:tv-swap .55s var(--ease-out) both }
@keyframes tv-swap { from { opacity:0; transform:translate3d(0,1.2vh,0) } to { opacity:1; transform:none } }
/* The minute ticks over with a soft lift. */
#clock .tk { display:inline-block; animation:tv-tick .5s var(--ease-out) both }
@keyframes tv-tick { from { opacity:0; transform:translate3d(0,.18em,0) } to { opacity:1; transform:none } }
/* A slow sheen runs along the card's glowing top edge. */
.right { overflow:hidden }
.right::after { content:''; position:absolute; top:-1px; left:0; width:30%; height:2px; pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent); opacity:.6; transform:translate3d(-110%,0,0); will-change:transform;
  animation:tv-sheen 9s var(--ease-io) 2s infinite }
@keyframes tv-sheen { 0% { transform:translate3d(-110%,0,0) } 35%, 100% { transform:translate3d(380%,0,0) } }
#glow { contain:strict }
#glow i { backface-visibility:hidden }
@media (prefers-reduced-motion: reduce) { #motes { display:none } #wrap { transition:none } #glow i, .ev.now i, .ev.now i::after, .right::after, .ev.in, .swap, #clock .tk { animation:none }
  .left > *, .right, #photo { transition:none; transform:none }
  #photo img, #photo .ph.show img { transition:none; transform:none }
  .hero, .hero svg *, .hero-pace, .hero-pace .hv-turn, .stk-a { animation:none !important } .hero-visit { display:none } }

/* ---------- styles (see tv-style.js) ----------
   Effects switched off are hidden or never built; the ones on move only with transform and opacity. */
@property --glowA { syntax:'<color>'; inherits:true; initial-value:rgba(109,194,164,.24) }
@property --glowG { syntax:'<color>'; inherits:true; initial-value:rgba(240,180,60,.14) }
@property --haloA { syntax:'<color>'; inherits:true; initial-value:rgba(109,194,164,.45) }
@property --haloG { syntax:'<color>'; inherits:true; initial-value:rgba(240,180,60,.38) }
:root { transition:--bg 1.2s var(--ease-io), --bg2 1.2s var(--ease-io), --accent 1.2s var(--ease-io), --gold 1.2s var(--ease-io),
  --glowA 1.2s var(--ease-io), --glowG 1.2s var(--ease-io), --haloA 1.2s var(--ease-io), --haloG 1.2s var(--ease-io) }
body:not(.fx-motes) #motes, body:not(.fx-glowbg) #glow, body:not(.fx-pattern) #pat { display:none }
body:not(.fx-shimmer) .right::after { display:none }
#fx { position:fixed; inset:0; pointer-events:none; overflow:hidden; contain:strict; z-index:0 }
.fx { position:absolute; inset:0 }
.fx i { position:absolute; display:block; will-change:transform, opacity }

/* Glow strength: g0 off ... g5 ultra. Shadows are drawn once; only "Plasma" and up add a slow opacity pulse. */
body.g0 #clock, body.g0 #date { text-shadow:none } body.g0 .right { box-shadow:0 2vh 6vh rgba(0,0,0,.25) } body.g0 .ev.first i, body.g0 .right::before { box-shadow:none }
body.g2 #clock { text-shadow:0 0 1vh var(--accent), 0 0 4vh var(--haloA), 0 0 9vh var(--haloA) }
body.g2 #date { text-shadow:0 0 1.2vh var(--accent), 0 0 3vh var(--haloA) }
body.g2 .right { border-color:color-mix(in srgb, var(--accent) 55%, transparent); box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent), 0 0 4vh var(--haloA), inset 0 0 3vh color-mix(in srgb, var(--accent) 12%, transparent) }
body.g2 .ev i, body.g3 .ev i, body.g4 .ev i, body.g5 .ev i { box-shadow:0 0 1.4vh .2vh var(--c) }
body.g3 #clock, body.g5 #clock { text-shadow:0 0 .6vh #fff, 0 0 1.6vh var(--accent), 0 0 5vh var(--accent), 0 0 12vh var(--haloA) }
body.g3 #date, body.g5 #date { text-shadow:0 0 .6vh #fff, 0 0 2vh var(--accent), 0 0 5vh var(--haloA) }
body.g3 .right, body.g5 .right { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 0 3vh var(--accent), 0 0 9vh var(--haloA), inset 0 0 4vh color-mix(in srgb, var(--accent) 18%, transparent) }
body.g3 #wx > svg, body.g5 #wx > svg { filter:drop-shadow(0 0 1vh var(--gold)) drop-shadow(0 0 3vh var(--haloG)) }
body.g4 #clock { width:fit-content; color:transparent; background:linear-gradient(100deg, var(--ink) 0%, var(--accent) 35%, var(--gold) 60%, var(--ink) 100%); background-size:200% 100%;
  -webkit-background-clip:text; background-clip:text; text-shadow:none; filter:drop-shadow(0 0 2vh var(--haloA)) }
body.g4 #clock .ap { color:var(--ink2); -webkit-text-fill-color:var(--ink2) }
body.g4 .right { border-color:color-mix(in srgb, var(--accent) 60%, transparent); box-shadow:0 0 3vh var(--haloA), inset 0 0 0 1px rgba(255,255,255,.12);
  background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, var(--card)), var(--card) 40%, color-mix(in srgb, var(--gold) 8%, var(--card))) }
/* Hologram's clock sheen moves by sliding its gradient: a small text area, so it stays cheap. */
body.g4:not(.perf) #clock { animation:sty-holo 7s linear infinite }
@keyframes sty-holo { to { background-position:-200% 0 } }
/* Plasma and Ultra pulse a ready-made glow layer over the card's edge. */
body.g3 .right > .lbl::after, body.g5 .right > .lbl::after { content:''; position:absolute; inset:-1px; border-radius:3vh; pointer-events:none;
  box-shadow:0 0 5vh 1vh var(--accent), inset 0 0 5vh var(--haloA); opacity:0; will-change:opacity; animation:sty-pulse 3.6s ease-in-out infinite }
@keyframes sty-pulse { 50% { opacity:.55 } }
body.g5 .ev .what, body.g5 #dinner .dn { text-shadow:0 0 1.5vh var(--haloA) }
body.g5 .lbl { color:var(--accent); text-shadow:0 0 1vh var(--haloA) }

/* Aurora: three wide soft ribbons swaying slowly. */
.fx-aurora-l i { left:-30vw; width:160vw; height:42vh; top:-6vh; border-radius:50%; opacity:.5; filter:none;
  background:radial-gradient(60% 50% at 50% 50%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 70%); animation:sty-aur 26s ease-in-out infinite alternate }
.fx-aurora-l i:nth-child(2) { top:8vh; background:radial-gradient(60% 50% at 50% 50%, color-mix(in srgb, var(--gold) 45%, transparent), transparent 70%); animation-duration:34s; animation-delay:-9s }
.fx-aurora-l i:nth-child(3) { top:-14vh; opacity:.35; animation-duration:41s; animation-delay:-20s }
@keyframes sty-aur { from { transform:translate3d(-12vw,0,0) rotate(-6deg) scaleY(.8) } to { transform:translate3d(12vw,6vh,0) rotate(5deg) scaleY(1.15) } }
/* Horizon grid: a perspective floor whose lines roll toward you, with a glowing sun. */
.fx-grid-l .gp { position:absolute; left:-50vw; right:-50vw; bottom:0; height:46vh; perspective:40vh; overflow:hidden;
  -webkit-mask-image:linear-gradient(to top, #000 30%, transparent); mask-image:linear-gradient(to top, #000 30%, transparent) }
.fx-grid-l .gl { position:absolute; left:0; right:0; bottom:0; height:200%; transform-origin:50% 100%; will-change:transform;
  background-image:linear-gradient(color-mix(in srgb, var(--accent) 70%, transparent) 2px, transparent 2px), linear-gradient(90deg, color-mix(in srgb, var(--accent) 70%, transparent) 2px, transparent 2px);
  background-size:8vh 8vh; animation:sty-grid 3s linear infinite }
@keyframes sty-grid { from { transform:rotateX(70deg) translate3d(0,0,0) } to { transform:rotateX(70deg) translate3d(0,8vh,0) } }
.fx-grid-l .sun { position:absolute; left:50%; bottom:40vh; width:34vh; height:34vh; margin-left:-17vh; border-radius:50%; opacity:.55;
  background:linear-gradient(var(--gold), var(--accent)); -webkit-mask-image:repeating-linear-gradient(to bottom, #000 0 2.2vh, transparent 2.2vh 3vh);
  mask-image:repeating-linear-gradient(to bottom, #000 0 2.2vh, transparent 2.2vh 3vh); box-shadow:0 0 8vh var(--haloG) }
/* Starfield: two layers of tiny dots twinkling at different speeds. */
.fx-stars-l i { left:0; top:0; width:.25vh; height:.25vh; border-radius:50%; animation:sty-twinkle 5s ease-in-out infinite }
.fx-stars-l i:nth-child(2) { width:.35vh; height:.35vh; animation-duration:8s; animation-delay:-3s }
@keyframes sty-twinkle { 50% { opacity:.35 } }
/* Scan lines: a faint ruled overlay with one bright band sweeping down. */
.fx-scan-l { background:repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 4px) }
.fx-scan-l i { left:0; right:0; top:0; height:18vh; background:linear-gradient(transparent, color-mix(in srgb, var(--accent) 16%, transparent), transparent); animation:sty-scan 7s linear infinite }
@keyframes sty-scan { from { transform:translate3d(0,-20vh,0) } to { transform:translate3d(0,110vh,0) } }
/* Orbit rings: dashed rings turning behind the clock. */
.fx-rings-l i { left:-6vh; top:-14vh; width:70vh; height:70vh; border-radius:50%; border:2px dashed color-mix(in srgb, var(--accent) 45%, transparent); animation:sty-spin 60s linear infinite }
.fx-rings-l i:nth-child(2) { left:4vh; top:-4vh; width:50vh; height:50vh; border:1px solid color-mix(in srgb, var(--gold) 40%, transparent); border-left-color:transparent; animation-duration:28s; animation-direction:reverse }
.fx-rings-l i:nth-child(3) { left:-16vh; top:-24vh; width:90vh; height:90vh; border:1px dotted color-mix(in srgb, var(--accent) 30%, transparent); animation-duration:110s }
@keyframes sty-spin { to { transform:rotate(360deg) } }
/* Light beams: tall soft beams sweeping from below like stage lights. */
.fx-beams-l i { bottom:-20vh; left:20vw; width:14vw; height:150vh; transform-origin:50% 100%; opacity:.22;
  background:linear-gradient(to top, var(--accent), transparent 80%); animation:sty-beam 9s ease-in-out infinite alternate }
.fx-beams-l i:nth-child(2) { left:55vw; background:linear-gradient(to top, var(--gold), transparent 80%); animation-duration:12s; animation-delay:-4s }
.fx-beams-l i:nth-child(3) { left:80vw; animation-duration:15s; animation-delay:-8s }
@keyframes sty-beam { from { transform:rotate(-24deg) } to { transform:rotate(24deg) } }
/* Pulse ripples: rings spreading out from the clock corner and fading. */
.fx-ripple-l i { left:6vw; top:4vh; width:40vh; height:40vh; margin:-20vh 0 0 -20vh; border-radius:50%; border:.3vh solid var(--accent); opacity:0; animation:sty-ripple 6s ease-out infinite }
.fx-ripple-l i:nth-child(2) { animation-delay:-2s } .fx-ripple-l i:nth-child(3) { animation-delay:-4s; border-color:var(--gold) }
@keyframes sty-ripple { 0% { transform:scale(.2); opacity:.6 } 100% { transform:scale(3); opacity:0 } }
/* Glowing screen edge: a frame of light that breathes. */
.fx-edge-l i { inset:0; box-shadow:inset 0 0 6vh color-mix(in srgb, var(--accent) 55%, transparent), inset 0 0 1.2vh var(--accent); animation:sty-pulse 5s ease-in-out infinite; opacity:.5 }
@media (prefers-reduced-motion: reduce) { .fx i, .fx .gl, body.g4 #clock, .right > .lbl::after { animation:none !important } }

/* ---------- the Style panel ---------- */
/* ---------- Style panel (sections on the left, tiles with live previews on the right) ----------
   One motion language: --hbx-e easing, 150 ms for focus, 250 ms for presses, 400 ms for the card opening. */
#sty { display:none; position:fixed; inset:0; z-index:20; background:linear-gradient(90deg, transparent 0 22%, rgba(0,0,0,.25) 45%); align-items:center; justify-content:flex-end; padding:0 3vw; box-sizing:border-box }
body.sty-open #sty { display:flex }
body.sty-open #lane, body.sty-open .hbx-pal { display:none }
.sty-card { width:min(72vw, 1500px); height:88vh; display:flex; flex-direction:column; background:color-mix(in srgb, color-mix(in srgb, var(--bg) 85%, #000) 90%, transparent); border:1px solid color-mix(in srgb, var(--accent) 55%, transparent); border-radius:3vh;
  box-shadow:0 3vh 9vh rgba(0,0,0,.55), 0 0 6vh var(--haloA); overflow:hidden; animation:sty-in 400ms var(--hbx-e) both }
@keyframes sty-in { from { opacity:0; translate:4vw 0 } to { opacity:1; translate:0 0 } }
.sty-h { display:flex; align-items:baseline; justify-content:space-between; gap:2vh; padding:2.4vh 3vh 1.6vh; border-bottom:1px solid var(--line) }
.sty-h b { font:700 4vh/1 var(--f-display); color:var(--ink); text-shadow:0 0 2vh var(--haloA) }
.sty-h span { font-size:1.7vh; color:var(--ink2) }
.sty-ver { font-style:normal; color:var(--accent); font-weight:700 }
.sty-body { flex:1; min-height:0; display:grid; grid-template-columns:19vw minmax(0, 1fr) }
.sty-nav { overflow:auto; padding:1.4vh 1.2vh; border-right:1px solid var(--line); scrollbar-width:none; display:flex; flex-direction:column; gap:.6vh }
.sty-ni { position:relative; padding:1.3vh 1.8vh; border-radius:1.6vh; color:var(--ink2); cursor:pointer; transition:background 150ms var(--hbx-e), color 150ms var(--hbx-e), scale 150ms var(--hbx-e) }
.sty-ni b { display:block; font:700 2.4vh/1.15 var(--f-display) }
.sty-ni span { display:block; font-size:1.5vh; margin-top:.3vh; opacity:.8 }
.sty-ni.cur { color:var(--ink); background:color-mix(in srgb, var(--accent) 14%, transparent) }
.sty-ni.cur::before { content:''; position:absolute; left:0; top:20%; bottom:20%; width:.5vh; border-radius:.5vh; background:var(--accent); box-shadow:0 0 1.4vh var(--accent) }
.sty-ni.on { color:var(--ink); background:color-mix(in srgb, var(--accent) 26%, transparent); scale:1.03 }
.sty-pane { overflow:auto; padding:1.6vh 2.4vh 4vh; scrollbar-width:none; scroll-behavior:auto }
.sty-sec { display:none } .sty-sec.show { display:block; animation:sty-sec 250ms var(--hbx-e) both }
@keyframes sty-sec { from { opacity:0 } to { opacity:1 } }
.sty-sh { display:flex; align-items:baseline; gap:2vh; margin:.4vh .4vh 1.4vh }
.sty-sh b { font:700 3.2vh/1 var(--f-display); color:var(--ink) }
.sty-sh span { font-size:1.7vh; color:var(--ink2) }
.sty-g { margin-bottom:2.4vh }
.sty-gh { display:flex; align-items:baseline; justify-content:space-between; gap:2vh; margin:0 .4vh 1vh }
.sty-gh b { font-size:1.8vh; letter-spacing:.14em; text-transform:uppercase; color:var(--ink2) }
.sty-gv { font-size:1.8vh; color:var(--accent); font-weight:700; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60% }
.sty-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(11.5vw, 1fr)); gap:1.6vh }
.sty-grid.sw { grid-template-columns:repeat(auto-fill, minmax(6.4vw, 1fr)) }
.sty-grid.any { grid-template-columns:repeat(24, minmax(0, 1fr)); gap:.6vh }
.sty-any { margin-top:1.6vh }
.hbx-opt { position:relative; display:flex; flex-direction:column; gap:.8vh; padding:.8vh; border-radius:1.6vh; cursor:pointer; color:var(--ink2); font-size:1.8vh;
  transition:scale 150ms var(--hbx-e), background 150ms var(--hbx-e), color 150ms var(--hbx-e) }
.hbx-opt .hbx-pvw { border-radius:1.2vh; font-size:1.6vh; transition:box-shadow 250ms var(--hbx-e) }
.hbx-opt .hbx-pv { border-radius:1.2vh; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08) }
.hbx-opt .hbx-ol { padding:0 .4vh; font-weight:700; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.hbx-opt.sel { color:var(--ink) }
.hbx-opt.sel .hbx-ol { color:var(--accent) }
.hbx-ck { position:absolute; top:1.2vh; right:1.2vh; width:2.6vh; height:2.6vh; border-radius:50%; display:grid; place-items:center; font-size:1.6vh; background:var(--accent); color:var(--bg); opacity:0; scale:.6; transition:opacity 150ms var(--hbx-e), scale 150ms var(--hbx-e) }
.hbx-opt.sel .hbx-ck { opacity:1; scale:1 }
.hbx-opt.on { background:color-mix(in srgb, var(--accent) 20%, transparent); color:var(--ink); scale:1.05; z-index:1 }
.hbx-opt.on .hbx-pvw { box-shadow:0 0 0 .35vh var(--hbx-glow), 0 0 2.4vh var(--hbx-g1) }
.hbx-opt.sw { padding:.5vh } .hbx-opt.sw .hbx-ol { font-size:1.4vh; text-align:center }
.hbx-opt.sw .hbx-pv { aspect-ratio:1.4 }
.hbx-opt.tiny { padding:.25vh; gap:0 } .hbx-opt.tiny .hbx-ol, .hbx-opt.tiny .hbx-ck { display:none } .hbx-opt.tiny .hbx-pv { aspect-ratio:1; border-radius:.6vh }
.hbx-opt.tiny.sel .hbx-pvw { box-shadow:0 0 0 .3vh #fff }
.hbx-opt.sw.act .hbx-pv { aspect-ratio:1.4 }
.sty-note { padding:1.6vh 3vh 2.4vh; font-size:1.9vh; line-height:1.4; color:var(--ink); border-top:1px solid var(--line) }
/* TV-only tile pictures */
.hbx-pv .pv-stripes { position:absolute; inset:0; display:flex } .hbx-pv .pv-stripes i { flex:1 } .hbx-pv .pv-stripes i:first-child { flex:1.6 }
.hbx-pv .pv-tag { position:relative; padding:.3vh 1vh; border-radius:9px; background:rgba(0,0,0,.45); color:#fff; font-weight:700; font-size:1.5vh }
.hbx-pv .pv-cyc { width:40%; aspect-ratio:1; border-radius:50%; background:conic-gradient(var(--accent), var(--gold), var(--accent)); animation:hbx-spin 8s linear infinite; box-shadow:0 0 2vh var(--haloA) }
@keyframes hbx-spin { to { rotate:360deg } }
.hbx-pv .pv-glow { font:800 3.4vh/1 var(--f-display) } .hbx-pv .pv-glow.g1 { text-shadow:0 0 1.6vh var(--haloA) } .hbx-pv .pv-glow.g2 { text-shadow:0 0 .6vh var(--accent), 0 0 2vh var(--haloA) }
.hbx-pv .pv-glow.g3, .hbx-pv .pv-glow.g5 { text-shadow:0 0 .4vh #fff, 0 0 1vh var(--accent), 0 0 3vh var(--accent) } .hbx-pv .pv-glow.g4 { color:var(--accent); text-shadow:-.15vh 0 cyan, .15vh 0 magenta }
.hbx-pv .pv-fx { font-weight:800; font-size:2.2vh; text-align:center; padding:0 1vh; color:var(--ink) } .hbx-pv .pv-fx.sm { font-size:1.8vh; line-height:1.2 }
.hbx-pv .pv-gear { position:relative; width:78%; height:56%; border-bottom:2px solid rgba(255,255,255,.25); display:flex; gap:6%; align-items:flex-end; padding-bottom:6% }
.hbx-pv .pv-gear i { flex:1; height:60%; border-radius:6px; background:rgba(255,255,255,.2) }
.hbx-pv .pv-gear b { position:absolute; width:18%; height:24%; border-radius:999px; background:var(--accent); box-shadow:0 0 1vh var(--accent) }
.hbx-pv .pv-gear.corner b { right:0; bottom:-34% } .hbx-pv .pv-gear.end b { right:0; bottom:6%; height:60% } .hbx-pv .pv-gear.start b { left:0; bottom:6%; height:60% }
.hbx-pv .pv-gear.start i:first-child { margin-left:22% } .hbx-pv .pv-gear.end i:last-child { margin-right:22% }
body.style-page .sty-card { width:min(96vw, 1500px) } body.style-page #sty { justify-content:center; background:none }
@media (max-width:900px) {
  .sty-card { height:94vh; width:96vw } .sty-body { grid-template-columns:1fr; grid-template-rows:auto 1fr } .sty-nav { flex-direction:row; overflow:auto; border-right:0; border-bottom:1px solid var(--line) }
  .sty-ni { flex:none } .sty-ni span { display:none } .sty-ni b { font-size:15px } .sty-grid { grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)) } .sty-grid.sw { grid-template-columns:repeat(auto-fill, minmax(64px, 1fr)) }
  .hbx-opt { font-size:13px } .sty-gh b, .sty-gv { font-size:12px } .sty-sh b { font-size:20px } .sty-sh span { font-size:12px } .sty-h b { font-size:24px } .sty-h span { font-size:12px } .sty-grid.any { grid-template-columns:repeat(12, minmax(0, 1fr)) }
}
@media (prefers-reduced-motion: reduce) { .sty-card, .sty-sec.show { animation:none } .hbx-pv * { animation:none !important } }

/* Compact chips for schemes, presets and on/off settings: a short color strip with the name under it. */
.sty-grid.cp { grid-template-columns:repeat(auto-fill, minmax(8.8vw, 1fr)); gap:1vh }
.hbx-opt.cp { padding:.5vh; gap:.4vh; font-size:1.5vh } .hbx-opt.cp .hbx-pv { aspect-ratio:3.4; border-radius:.8vh } .hbx-opt.cp .hbx-pvw { border-radius:.8vh }
.hbx-opt.cp .hbx-ck { top:.6vh; right:.6vh; width:2vh; height:2vh; font-size:1.2vh }
.hbx-opt.cp .pv-fx { font-size:1.4vh } .hbx-opt.cp .pv-fx.sm { font-size:1.2vh } .hbx-opt.cp .pv-glow { font-size:2vh } .hbx-opt.cp .pv-cyc { width:18% }
.hbx-opt.cp.on { scale:1.08 }
.sty-ni span { font-size:1.35vh } .sty-ni b { font-size:2.2vh } .sty-body { grid-template-columns:20vw minmax(0, 1fr) }
/* Lighter while Style is open: only the focused tile's preview moves (the screen behind keeps moving, to show the change). */
#sty .hbx-opt:not(.on) .hbx-pv * { animation-play-state:paused !important }
#sty .hbx-opt.on .hbx-pvw { box-shadow:0 0 0 .35vh var(--hbx-glow) !important; animation:none !important; background-image:none !important }
.sty-card { box-shadow:0 2vh 6vh rgba(0,0,0,.5) }
/* ---------- premium polish (page 13) ----------
   Foundation, always on: one display font (Bricolage Grotesque) for the clock and headings, one text font (Atkinson
   Hyperlegible) for everything else; one spacing scale (8 / 16 / 24 / 48 px at 1080p, written in vh so it scales);
   one easing and three speeds (150 / 250 / 400 ms). Things fade and slide a short way in, never pop.
   Everything that can be switched lives on <html> as hbx-* classes set by the shared look (Style → each section). */
:root { --s1:.741vh; --s2:1.481vh; --s3:2.222vh; --s4:4.444vh; --e:var(--hbx-e, cubic-bezier(.2,.8,.2,1)); --t1:150ms; --t2:250ms; --t3:400ms }

/* Layout on the grid, with more room to breathe */
#wrap { padding:calc(var(--s4) * 1.5) calc(var(--s4) * 2.25) var(--s3); gap:calc(var(--s4) * 1.5) }
body.saver #wrap { padding:calc(var(--s4) * 2) calc(var(--s4) * 2.75) var(--s3) }
/* A big, bold clock; lighter, smaller supporting text */
#clock { font-weight:800; font-size:18vh; letter-spacing:-.045em; line-height:.86 }
body.saver #clock { font-size:23vh }
#clock .ap { font-family:var(--f-body); font-weight:400; font-size:.2em; letter-spacing:.12em; opacity:.8 }
#date { margin-top:var(--s3); font-size:4.2vh; font-weight:500; letter-spacing:.005em }
#wx { margin-top:var(--s4); gap:var(--s2); font-size:2.4vh; font-weight:400 }
#wx b { font-weight:700 }
#next { margin-top:var(--s4) }
.right { padding:var(--s4) var(--s4) var(--s3); border-radius:var(--s3) }
.lbl { font-size:1.6vh; letter-spacing:.2em; font-weight:700; opacity:.85 }
#up { margin-top:var(--s2) }
.ev { gap:var(--s2); padding:var(--s2) 0 }
.ev .what { font-weight:600 } .ev.first .what { font-weight:700 }
#dinner, #chores { gap:var(--s2); margin-top:var(--s2); font-size:2.4vh }
#photo { border-radius:var(--s3) }

/* One motion language: fade + short slide, 400 ms, the same easing everywhere */
.left > *, .right, #photo { transform:translate3d(0,var(--s2),0); transition:opacity var(--t3) var(--e), transform var(--t3) var(--e) }
body.ready #date { transition-delay:60ms } body.ready #wx { transition-delay:120ms } body.ready #next { transition-delay:180ms }
body.ready .right, body.ready #photo { transition-delay:180ms }
body.booting .left > *, body.booting .right, body.booting #photo, body.booting #pstrip { opacity:0 !important; transform:translate3d(0,var(--s2),0) !important; transition:none !important }
.ev.in { animation:tv-row var(--t3) var(--e) both; animation-delay:calc(var(--n, 0) * 60ms) }
@keyframes tv-row { from { opacity:0; transform:translate3d(var(--s2),0,0) } to { opacity:1; transform:none } }
.swap { animation:tv-swap var(--t3) var(--e) both }
@keyframes tv-swap { from { opacity:0; transform:translate3d(0,var(--s1),0) } to { opacity:1; transform:none } }
:root { transition:--bg var(--t3) var(--e), --bg2 var(--t3) var(--e), --accent var(--t3) var(--e), --gold var(--t3) var(--e) }

/* The slow ambient light behind everything; it drifts a few pixels a minute so the screen never looks frozen */
#amb { position:fixed; inset:-4vh -4vw; pointer-events:none;
  background:radial-gradient(70vh 55vh at 18% 22%, var(--glowA), transparent 70%), radial-gradient(60vh 50vh at 82% 70%, var(--glowG), transparent 70%); opacity:.7 }
html.hbx-drift #amb { animation:pol-drift 900s ease-in-out infinite alternate }
/* The pattern is drawn a little bigger than the screen and moved, never repainted (moving background-position redrew
   the whole screen every frame and made everything choppy on the TV box). */
html.hbx-drift #pat { inset:-6vh -8vw; will-change:transform; animation:pol-drift2 1200s ease-in-out infinite alternate }
@keyframes pol-drift { to { transform:translate3d(-3vw,2.5vh,0) } }
/* While Style is open the extra layers rest, so the panel's previews have the TV's graphics memory to themselves */
body.sty-open #amb, body.sty-open #tod, body.sty-open #wxfx, body.sty-open #pat { display:none }
@keyframes pol-drift2 { to { transform:translate3d(-6vw,4vh,0) } }

/* Time of day: warm mornings, deeper evenings, a calm dimmed night (only when switched on) */
#tod { position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity var(--t3) var(--e);
  background:radial-gradient(120vw 70vh at 50% -15%, var(--tod-c, transparent), transparent 70%), rgba(0,0,0,var(--tod-d, 0)) }
html.hbx-tod #tod { opacity:1 }
html.hbx-tod.tod-night #wrap { opacity:.86; transition:opacity var(--t3) var(--e) }

/* Weather touches: a light rain shimmer, slow snow, frost in the corners on cold mornings */
#wxfx { position:fixed; inset:0; pointer-events:none; overflow:hidden; contain:strict }
#wxfx .rd { position:absolute; top:-12vh; width:1px; height:8vh; rotate:12deg; background:linear-gradient(transparent, rgba(205,228,255,.32)); will-change:transform; animation:wx-rain linear infinite }
@keyframes wx-rain { to { transform:translate3d(-25vh,125vh,0) } }
#wxfx .sf { position:absolute; top:-3vh; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.85), rgba(255,255,255,0) 70%); will-change:transform; animation:wx-snow linear infinite }
@keyframes wx-snow { 25% { transform:translate3d(1.5vw,28vh,0) } 50% { transform:translate3d(-1vw,56vh,0) } 75% { transform:translate3d(1.2vw,84vh,0) } to { transform:translate3d(-.5vw,110vh,0) } }
#wxfx.frost::before { content:''; position:absolute; inset:0; opacity:.9;
  background:radial-gradient(40vh 32vh at 0 0, rgba(215,236,255,.22), transparent 70%), radial-gradient(40vh 32vh at 100% 0, rgba(215,236,255,.18), transparent 70%),
    radial-gradient(34vh 26vh at 0 100%, rgba(215,236,255,.14), transparent 70%), radial-gradient(34vh 26vh at 100% 100%, rgba(215,236,255,.12), transparent 70%) }

/* Holidays: Subtle keeps the colors and fonts with a lighter pattern and no characters on the home screen */
html[data-hbx-holi="subtle"] #pat { opacity:.045 }
html[data-hbx-holi="subtle"] body.home #lane { display:none }

/* Status strip: weather, Wi-Fi and who's home, top right */
#pstrip { position:fixed; top:var(--s3); right:calc(var(--s4) * 2.25); z-index:4; display:flex; align-items:center; gap:var(--s2); padding:var(--s1) var(--s2);
  border-radius:99px; background:color-mix(in srgb, var(--card) 70%, transparent); border:1px solid var(--line); border-top-color:rgba(255,255,255,.16);
  font:400 1.8vh/1 var(--f-body); color:var(--ink2); opacity:1; transition:opacity var(--t3) var(--e) }
#pstrip[hidden] { display:none }
#pstrip > span { display:inline-flex; align-items:center; gap:var(--s1); white-space:nowrap }
#pstrip b { color:var(--ink); font-weight:700 }
#pstrip svg { width:2.2vh; height:2.2vh; color:var(--gold) }
#pstrip .sep { width:1px; height:1.8vh; background:var(--line) }
body.sty-open #pstrip { opacity:0 }

/* Startup: the Home Base mark glows in, then the screen assembles */
#boot { position:fixed; inset:0; z-index:40; display:grid; place-items:center; background:radial-gradient(60vh 40vh at 50% 50%, var(--glowA), transparent 70%), var(--bg); pointer-events:none }
#boot[hidden] { display:none }
#boot .bm { display:flex; align-items:center; gap:var(--s3); opacity:0; transform:scale(.96) }
#boot svg { width:11vh; height:11vh; color:var(--accent); filter:drop-shadow(0 0 2vh var(--haloA)) }
#boot b { font:800 8vh/1 var(--f-display); letter-spacing:-.03em; color:var(--ink); text-shadow:0 0 3vh var(--haloA) }
#boot.go .bm { animation:boot-in var(--t3) var(--e) 100ms forwards, boot-glow 1.2s ease-in-out 500ms 1 }
#boot.out { opacity:0; transition:opacity var(--t3) var(--e) }
@keyframes boot-in { to { opacity:1; transform:none } }
@keyframes boot-glow { 50% { filter:drop-shadow(0 0 3vh var(--haloA)) brightness(1.15) } }

/* Screensaver photos: slow crossfades with a gentle pan and zoom (Ken Burns) when it's on */
html.hbx-kb #photo img { transform:scale(1) translate3d(0,0,0); transition:transform var(--kbd, 17s) linear }
html.hbx-kb #photo .ph.show img { transform:scale(var(--ks, 1.12)) translate3d(var(--kx, 0), var(--ky, 0), 0) }
html:not(.hbx-kb) #photo img, html:not(.hbx-kb) #photo .ph.show img { transform:none; transition:none }

/* Settings: a side panel that slides in from the right (where the Style button sits), the screen dimmed behind */
#sty { padding:0; justify-content:flex-end; align-items:stretch; background:rgba(0,0,0,.32); animation:sty-scrim var(--t2) var(--e) both }
@keyframes sty-scrim { from { background:rgba(0,0,0,0) } }
body.sty-closing #sty { background:rgba(0,0,0,0); transition:background var(--t2) var(--e) }
body.sty-closing .sty-card { transform:translate3d(100%,0,0); transition:transform var(--t2) var(--e) }
.sty-card { width:min(68vw, 1400px); height:100vh; border-radius:var(--s3) 0 0 var(--s3); border-right:0; border-top-color:rgba(255,255,255,.16);
  box-shadow:-2vh 0 6vh rgba(0,0,0,.45); animation:sty-in var(--t3) var(--e) both }
@keyframes sty-in { from { transform:translate3d(100%,0,0) } to { transform:none } }
.sty-h { padding:var(--s4) var(--s4) var(--s2) }
.sty-pane { padding:var(--s2) var(--s3) var(--s4) }
.sty-ni { display:grid; grid-template-columns:3vh minmax(0, 1fr); column-gap:var(--s2); align-items:center }
.sty-ni .hbx-ic { grid-row:span 2; width:3vh; height:3vh; opacity:.85 }
.sty-ni.cur .hbx-ic, .sty-ni.on .hbx-ic { color:var(--accent); opacity:1 }
.sty-ni span { grid-column:2 }
/* The panel stays easy to read: nearly solid in Performance mode, frosted (blurred) otherwise */
html.hbx-on #sty .sty-card { background-color:color-mix(in srgb, var(--hbx-cardc) 96%, #000) !important }
html.hbx-on.hbx-glass:not(.hbx-perf) #sty .sty-card { background-color:color-mix(in srgb, var(--hbx-cardc) 74%, transparent) !important; -webkit-backdrop-filter:blur(24px) saturate(1.35); backdrop-filter:blur(24px) saturate(1.35) }
body.style-page .sty-card { height:94vh; border-radius:var(--s3); border-right:1px solid color-mix(in srgb, var(--accent) 55%, transparent) }
/* Highlighted tiles in the panel lift toward you (tilt) and catch a sheen */
.hbx-opt { transition:scale var(--t1) var(--e), transform var(--t2) var(--e), background var(--t1) var(--e), color var(--t1) var(--e) }
html.hbx-tilt #sty .hbx-opt.on { transform:perspective(60vh) rotateX(5deg) translate3d(0,-.4vh,0) }
#sty .hbx-pvw { position:relative; overflow:hidden }
html.hbx-sheen #sty .hbx-opt.on .hbx-pvw::after { content:''; position:absolute; inset:0; z-index:2; pointer-events:none; border-radius:inherit;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%); animation:pol-sheen var(--t3) var(--e) both }
@keyframes pol-sheen { from { transform:translate3d(-110%,0,0) } to { transform:translate3d(110%,0,0) } }

/* Performance mode (on by default on the TV box): no blur, no weather or drift layers, lighter effects */
html.hbx-perf #wxfx .sf:nth-child(n+13), html.hbx-perf #wxfx .rd:nth-child(n+19) { display:none }
@media (prefers-reduced-motion: reduce) {
  #amb, #pat, #wxfx *, #boot .bm, .ev.in, .swap { animation:none !important }
  html.hbx-kb #photo img { transition:none !important; transform:none !important }
}
/* The section list stays one line per name and hint on the TV */
.sty-body { grid-template-columns:22vw minmax(0, 1fr) }
.sty-ni b, .sty-ni span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.sty-ni b { font-size:2.1vh } .sty-ni span { font-size:1.3vh }
.sty-nav { gap:var(--s1); padding:var(--s2) var(--s2) }
/* ---------- Style panel: condensed and snappy ----------
   Narrower card, slimmer section list (names only), smaller tiles so more fit per row, and quick motion:
   the panel slides in in 180 ms, focus moves in 90 ms, sections switch instantly. */
.sty-card { width:min(60vw, 1250px); animation-duration:180ms }
#sty { animation-duration:120ms }
body.sty-closing .sty-card, body.sty-closing #sty { transition-duration:150ms }
.sty-h { padding:var(--s3) var(--s3) var(--s1) }
.sty-h b { font-size:3vh } .sty-h span { font-size:1.4vh }
.sty-body { grid-template-columns:16.5vw minmax(0, 1fr) }
.sty-nav { padding:var(--s1); gap:2px }
.sty-ni { padding:.9vh 1.2vh; border-radius:1.2vh; column-gap:var(--s1); grid-template-columns:2.4vh minmax(0, 1fr) }
.sty-ni b { font-size:1.9vh } .sty-ni span { display:none } .sty-ni .hbx-ic { width:2.4vh; height:2.4vh; grid-row:auto }
.sty-pane { padding:var(--s1) var(--s2) var(--s3) }
.sty-sh { margin:.2vh .2vh .8vh } .sty-sh b { font-size:2.4vh } .sty-sh span { font-size:1.4vh }
.sty-g { margin-bottom:1.6vh }
.sty-gh { margin:0 .2vh .6vh } .sty-gh b, .sty-gv { font-size:1.4vh }
.sty-grid { grid-template-columns:repeat(auto-fill, minmax(8.4vw, 1fr)); gap:1vh }
.sty-grid.cp { grid-template-columns:repeat(auto-fill, minmax(6.6vw, 1fr)); gap:.8vh }
.sty-grid.sw { grid-template-columns:repeat(auto-fill, minmax(4.4vw, 1fr)); gap:.8vh }
.hbx-opt { padding:.4vh; gap:.3vh; font-size:1.45vh; border-radius:1.1vh }
.hbx-opt .hbx-pvw, .hbx-opt .hbx-pv { border-radius:.9vh }
.hbx-ck { top:.8vh; right:.8vh; width:2vh; height:2vh; font-size:1.2vh }
.hbx-opt.cp .hbx-pv { aspect-ratio:3.8 }
.sty-sec.show { animation:none }
.hbx-opt, .sty-ni, .hbx-ck, .hbx-opt .hbx-pvw { transition-duration:90ms !important }
html.hbx-sheen #sty .hbx-opt.on .hbx-pvw::after { animation-duration:250ms }

/* ---------- Layouts (Style → Layout) ----------
   The same pieces arranged seven ways. Home screen only; the screensaver keeps its own arrangement.
   --row is set by the app (the top of its app rows), so nothing ever runs behind them. */
html[data-hbx-layout="mirror"] body.home #wrap { grid-template-columns:minmax(0, .92fr) minmax(0, 1fr) }
html[data-hbx-layout="mirror"] body.home .left { order:2; align-items:flex-end; text-align:right }
html[data-hbx-layout="mirror"] body.home #wx { flex-direction:row-reverse }

html[data-hbx-layout="center"] body.home #wrap, html[data-hbx-layout="glance"] body.home #wrap { grid-template-columns:minmax(0, 1fr); grid-template-rows:auto minmax(0, 1fr); gap:var(--s3) }
html[data-hbx-layout="center"] body.home .left { align-items:center; text-align:center }
html[data-hbx-layout="center"] body.home .right, html[data-hbx-layout="glance"] body.home .right { background:none; border:0; box-shadow:none; padding:0; overflow:visible; -webkit-backdrop-filter:none; backdrop-filter:none }
html[data-hbx-layout="center"] body.home .right::before, html[data-hbx-layout="center"] body.home .right::after,
html[data-hbx-layout="glance"] body.home .right::before, html[data-hbx-layout="glance"] body.home .right::after,
html[data-hbx-layout="center"] body.home .right > .lbl:first-child, html[data-hbx-layout="glance"] body.home .right > .lbl:first-child { display:none }
html[data-hbx-layout="center"] body.home #up, html[data-hbx-layout="glance"] body.home #up { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:var(--s2); margin:0 }
html[data-hbx-layout="center"] body.home .ev, html[data-hbx-layout="glance"] body.home .ev { border:1px solid var(--line); border-top-color:rgba(255,255,255,.16); border-radius:var(--s2); padding:var(--s2) var(--s3) var(--s2) var(--s2); background:var(--card) }
html[data-hbx-layout="center"] body.home .ev:nth-child(n+4), html[data-hbx-layout="glance"] body.home .ev:nth-child(n+4) { display:none }
html[data-hbx-layout="center"] body.home .ev.first .what, html[data-hbx-layout="glance"] body.home .ev.first .what { font-size:3.2vh }
html[data-hbx-layout="center"] body.home #dinner, html[data-hbx-layout="center"] body.home #chores { justify-content:center }
html[data-hbx-layout="center"] body.home #clock { font-size:16vh }

html[data-hbx-layout="glance"] body.home .left { flex-direction:row; align-items:center; gap:var(--s4); padding:var(--s2) var(--s4); border-radius:var(--s3);
  background:var(--card); border:1px solid var(--line); border-top-color:rgba(255,255,255,.16) }
html[data-hbx-layout="glance"] body.home #clock { font-size:9vh }
html[data-hbx-layout="glance"] body.home #date, html[data-hbx-layout="glance"] body.home #wx { margin:0 }
html[data-hbx-layout="glance"] body.home #pstrip { display:none }

html[data-hbx-layout="minimal"] body.home .right { display:none }
html[data-hbx-layout="minimal"] body.home .left { justify-content:flex-end }
html[data-hbx-layout="minimal"] body.home #clock { font-size:24vh }
html[data-hbx-layout="minimal"] body.home #next { display:block }

html[data-hbx-layout="panel"] body.home .right { position:fixed; top:0; right:0; bottom:var(--row); width:36vw; max-height:none; border-radius:var(--s3) 0 0 var(--s3); border-right:0;
  padding:calc(var(--s4) * 1.5) var(--s4) var(--s3) }
html[data-hbx-layout="panel"] body.home #pstrip { right:calc(36vw + var(--s3)) }

html[data-hbx-layout="magazine"] body.home .left { padding-top:var(--s2) }
html[data-hbx-layout="magazine"] body.home #date { order:-1; margin:0 0 var(--s2); font:700 1.9vh/1 var(--f-body); letter-spacing:.32em; text-transform:uppercase; color:var(--ink2); text-shadow:none }
html[data-hbx-layout="magazine"] body.home #clock { font-size:22vh; font-weight:300; letter-spacing:-.06em }
html[data-hbx-layout="magazine"] body.home #wrap { grid-template-columns:minmax(0, 1.2fr) minmax(0, .8fr) }
html[data-hbx-layout="magazine"] body.home .ev .what { font-weight:500 }

/* The Style and Settings buttons sit at the top right (drawn by the app): the screen starts a little lower so nothing sits under them. */
body.gear-top #wrap { padding-top:calc(6.5vh + 4vh) }
body.gear-top #pstrip { right:calc(var(--s4) * 2.25 + 13vw) }
/* ---------- Watch ("What should I watch?"): full screen, Nuvio-style ---------- */
#watch { display:none; position:fixed; inset:0; z-index:25; color:#fff; font-family:var(--f-body); overflow:hidden; background:#05070a }
/* It sits below the home screen: opening scrolls everything up, closing scrolls back down. */
#watch { --w-e:cubic-bezier(.22,1,.36,1) }
body.w-open #watch { display:block; animation:w-up 420ms var(--w-e) both }
body.w-closing #watch { animation:w-down 340ms cubic-bezier(.5,0,.2,1) both }
#wrap { transition:translate 420ms cubic-bezier(.22,1,.36,1), opacity 320ms ease }
body.w-open:not(.w-closing) #wrap { translate:0 -40vh; opacity:0 }
@keyframes w-up { from { translate:0 100vh; opacity:.4 } to { translate:0 0; opacity:1 } }
@keyframes w-down { from { translate:0 0; opacity:1 } to { translate:0 100vh; opacity:.4 } }
.w-row { transition:opacity 260ms var(--w-e), translate 380ms var(--w-e) }
.w-row.past { opacity:0; translate:0 -2vh }
.w-tag { position:absolute; left:6vw; top:3.4vh; z-index:1; font:700 1.6vh/1 var(--f-body); letter-spacing:.32em; text-transform:uppercase; color:var(--accent, #ff8a5c) }
body.w-open #lane, body.w-open .hbx-pal { display:none }
@keyframes w-in { from { opacity:0; scale:1.02 } to { opacity:1; scale:1 } }
.w-bd i { position:absolute; inset:0; background-size:cover; background-position:center 25%; opacity:0; transition:opacity 500ms ease, scale 8s linear; scale:1.04 }
.w-bd i.on { opacity:1; scale:1 }
.w-shade { position:absolute; inset:0; background:
  linear-gradient(90deg, rgba(5,7,10,.96) 0%, rgba(5,7,10,.82) 32%, rgba(5,7,10,.25) 62%, rgba(5,7,10,.05) 100%),
  linear-gradient(0deg, rgba(5,7,10,1) 0%, rgba(5,7,10,.88) 34%, rgba(5,7,10,0) 62%) }
.w-in { position:absolute; inset:0 }
.w-toast { position:absolute; left:50%; bottom:5vh; translate:-50% 0; padding:1.4vh 2.6vh; border-radius:1.6vh; background:rgba(20,24,30,.92); border:1px solid rgba(255,255,255,.12); font-size:2vh; z-index:2 }
/* the questions */
.w-ask { position:absolute; inset:0; padding:8vh 6vw; display:flex; flex-direction:column; gap:3.6vh;
  background:radial-gradient(circle at 80% 10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 55%), radial-gradient(circle at 10% 90%, color-mix(in srgb, var(--gold) 14%, transparent), transparent 50%) }
.w-title b { display:block; font:800 6vh/1.05 var(--f-display); letter-spacing:-.02em }
.w-title span { display:block; margin-top:1vh; font-size:2.2vh; color:rgba(255,255,255,.65) }
.w-lbl { display:block; font-size:1.6vh; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.55); margin-bottom:1.2vh }
.w-chips { display:flex; flex-wrap:wrap; gap:1.2vh }
.w-chip { display:inline-flex; align-items:center; gap:1vh; padding:1.3vh 2.2vh; border-radius:99vh; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1); font-size:2.2vh; font-weight:600;
  transition:scale 150ms var(--hbx-e, ease), background 150ms, border-color 150ms, box-shadow 150ms; cursor:pointer }
.w-chip .i { font-size:2.4vh }
.w-chip.sel { background:color-mix(in srgb, var(--accent) 30%, transparent); border-color:color-mix(in srgb, var(--accent) 80%, white 0%) }
.w-chip.on-f, .w-btn.on-f { scale:1.08; background:#fff; color:#0b0d10; border-color:#fff; box-shadow:0 1vh 4vh rgba(0,0,0,.5), 0 0 3vh color-mix(in srgb, var(--accent) 60%, transparent) }
.w-go { display:flex; gap:1.6vh; margin-top:1vh }
.w-btn { display:inline-flex; align-items:center; gap:1vh; padding:1.5vh 3vh; border-radius:1.4vh; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.14); font-size:2.2vh; font-weight:700;
  transition:scale 150ms var(--hbx-e, ease), background 150ms, box-shadow 150ms; cursor:pointer; white-space:nowrap }
.w-btn.pri { background:color-mix(in srgb, var(--accent) 85%, #000); border-color:transparent }
/* loading */
.w-load { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.4vh; font-size:2.4vh; color:rgba(255,255,255,.75); text-align:center; padding:0 10vw }
.w-load i { width:6vh; height:6vh; border-radius:50%; border:.5vh solid rgba(255,255,255,.15); border-top-color:var(--accent); animation:w-spin 900ms linear infinite }
@keyframes w-spin { to { rotate:360deg } }
/* results: hero on top, rows of posters below */
.w-res { position:absolute; inset:0 }
.w-hero { position:absolute; left:6vw; top:8vh; width:42vw }
.w-meta { animation:w-fade 320ms var(--w-e) both }
@keyframes w-fade { from { opacity:0; translate:0 1.5vh } to { opacity:1; translate:0 0 } }
.w-logo { display:block; max-width:30vw; max-height:15vh; object-fit:contain; object-position:left bottom; filter:drop-shadow(0 .6vh 2vh rgba(0,0,0,.6)) }
.w-name { font:800 6.4vh/1.02 var(--f-display); letter-spacing:-.02em; text-shadow:0 .6vh 3vh rgba(0,0,0,.6) }
.w-chips2 { display:flex; flex-wrap:wrap; gap:1vh; margin:2vh 0 1.4vh }
.w-chips2 span { padding:.5vh 1.3vh; border-radius:.9vh; background:rgba(255,255,255,.12); font-size:1.7vh; font-weight:700; backdrop-filter:blur(1vh) }
.w-chips2 span:first-child { background:color-mix(in srgb, var(--gold) 85%, #000); color:#111 }
.w-meta p { margin:0; font-size:2.05vh; line-height:1.45; color:rgba(255,255,255,.82); display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; text-shadow:0 .3vh 1.5vh rgba(0,0,0,.7) }
.w-btns { position:absolute; left:6vw; top:45vh; display:flex; gap:1.4vh }
.w-rows { position:absolute; left:0; right:0; top:55vh; transition:transform 380ms var(--w-e); will-change:transform }
.w-row { height:32vh; overflow:visible }
.w-row h3 { margin:0 0 1.4vh 6vw; font:700 2.4vh/1 var(--f-display); color:rgba(255,255,255,.9) }
.w-track { display:flex; gap:2.6vh; padding:1.6vh 6vw 4vh; transition:transform 300ms var(--w-e); will-change:transform }
.w-card { position:relative; flex:none; width:15vh; height:22.5vh; border-radius:1.4vh; overflow:hidden; background:#151a20; box-shadow:0 .8vh 2.4vh rgba(0,0,0,.45);
  transition:scale 220ms var(--w-e), box-shadow 220ms, outline-color 150ms; outline:.35vh solid transparent; outline-offset:.4vh; cursor:pointer }
.w-card img { width:100%; height:100%; object-fit:cover; display:block }
.w-cn { position:absolute; left:0; right:0; bottom:0; padding:3vh 1vh 1vh; font-size:1.5vh; font-weight:700; background:linear-gradient(0deg, rgba(0,0,0,.85), transparent); opacity:0; transition:opacity 180ms }
.w-card.on-f { scale:1.12; outline-color:#fff; box-shadow:0 2vh 5vh rgba(0,0,0,.6), 0 0 4vh color-mix(in srgb, var(--accent) 55%, transparent); z-index:1 }
.w-card.on-f .w-cn { opacity:1 }
.w-card.noimg { background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 45%, #111), #0b0d10) }
.w-card.noimg .w-cn { opacity:1; top:0; display:flex; align-items:flex-end; font-size:2vh; background:none }
.w-card.yt { width:26vh; height:15vh; align-self:flex-start }
.w-ytb { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; gap:.4vh; padding:1.6vh; background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 55%, #111), #2a0f12) }
.w-ytb span { position:absolute; top:1.4vh; right:1.6vh; font-size:3.2vh }
.w-ytb b { font-size:1.9vh; line-height:1.15; text-transform:capitalize }
.w-ytb small { font-size:1.4vh; color:#ff6b6b; font-weight:800; letter-spacing:.08em; text-transform:uppercase }
body.perf .w-bd i { transition:opacity 400ms; scale:1 }
body.perf .w-chips2 span { backdrop-filter:none }
@media (prefers-reduced-motion: reduce) { #wrap, #watch, .w-bd i, .w-row, .w-rows, .w-track, .w-card, .w-chip, .w-btn, .w-meta { animation:none !important; transition:none !important } }
body.w-open #pstrip { display:none !important }
/* ---------- Evergreen Glow (premium Christmas) ---------- */
html[data-th="evergreenglow"] body { background:radial-gradient(ellipse 120% 90% at 50% 120%, #0E2A1C 0%, #07170F 55%, #040C08 100%) }
html[data-th="evergreenglow"] #pat { opacity:.05 }
#xglow, #xbokeh, #xlights { position:fixed; inset:0; pointer-events:none; overflow:hidden; contain:strict }
/* This theme brings its own glow and light, so the page's usual glow and motes step aside (fewer layers to move). */
html[data-th="evergreenglow"] #glow, html[data-th="evergreenglow"] #motes, html[data-th="evergreenglow"] #amb { display:none }
/* Two slow glows, garnet and pine, with a little candlelight between them. Only moved (never scaled or repainted). */
#xglow i { position:absolute; border-radius:50%; will-change:transform }
#xglow .g1 { width:70vw; height:75vh; left:-15vw; top:-22vh; background:radial-gradient(closest-side, rgba(179,38,58,.30) 0%, rgba(179,38,58,.10) 38%, transparent 68%); animation:xg1 46s ease-in-out infinite alternate }
#xglow .g2 { width:75vw; height:85vh; right:-20vw; bottom:-30vh; background:radial-gradient(closest-side, rgba(47,138,87,.30) 0%, rgba(47,138,87,.10) 40%, transparent 70%); animation:xg2 58s ease-in-out infinite alternate }
#xglow .g3 { width:60vw; height:60vh; left:30vw; top:10vh; background:radial-gradient(closest-side, rgba(217,180,90,.10) 0%, transparent 65%); }
@keyframes xg1 { from { transform:translate3d(0,0,0) } to { transform:translate3d(10vw,7vh,0) } }
@keyframes xg2 { from { transform:translate3d(0,0,0) } to { transform:translate3d(-12vw,-6vh,0) } }
/* Bokeh: soft-edged circles of light (no blur filter, so it stays light on the TV). */
#xbokeh .bk { position:absolute; border-radius:50%; opacity:0; will-change:transform, opacity; animation:xrise linear infinite }
#xbokeh .bk.gold { background:radial-gradient(closest-side, rgba(244,214,140,.75) 0%, rgba(217,180,90,.35) 45%, transparent 70%) }
#xbokeh .bk.red { background:radial-gradient(closest-side, rgba(232,96,110,.6) 0%, rgba(179,38,58,.3) 45%, transparent 70%) }
#xbokeh .bk.green { background:radial-gradient(closest-side, rgba(120,210,150,.5) 0%, rgba(47,138,87,.28) 45%, transparent 70%) }
@keyframes xrise { 0% { transform:translate3d(0,0,0); opacity:0 } 15% { opacity:.55 } 70% { opacity:.35 } 100% { transform:translate3d(3vw,-45vh,0); opacity:0 } }
#xbokeh .fl { position:absolute; top:-2vh; border-radius:50%; background:radial-gradient(closest-side, #fff 40%, rgba(255,255,255,0)); will-change:transform; animation:xfall linear infinite }
@keyframes xfall { from { transform:translate3d(0,0,0) } 50% { transform:translate3d(1.5vw,52vh,0) } to { transform:translate3d(-1vw,106vh,0) } }
/* The garland of lights along the top. */
#xlights { bottom:auto; height:36vh; overflow:visible }
#xlights .xgar { position:absolute; left:0; top:0 }
#xlights .xbigbow { position:absolute; left:50%; top:1.4vh; width:38vh; height:32.3vh; transform:translateX(-50%) }
#xlights .bl { position:absolute; width:.95vh; height:1.35vh; margin:-.2vh 0 0 -.47vh; border-radius:50% 50% 45% 45% }
#xlights .bl.tw { animation:xtw ease-in-out infinite alternate; will-change:opacity }
#xlights .bl::before { content:''; position:absolute; left:50%; top:-.35vh; width:.5vh; height:.45vh; margin-left:-.25vh; border-radius:.1vh; background:#2A3A30 }
#xlights .bl.r { background:#FF5A6A; box-shadow:0 0 1vh .25vh rgba(255,70,90,.75), 0 0 2.6vh .4vh rgba(200,30,50,.35) }
#xlights .bl.g { background:#5BE08E; box-shadow:0 0 1vh .25vh rgba(70,220,130,.7), 0 0 2.6vh .4vh rgba(40,150,90,.35) }
#xlights .bl.y { background:#FFD77A; box-shadow:0 0 1vh .25vh rgba(255,210,110,.8), 0 0 2.6vh .4vh rgba(220,170,60,.35) }
#xlights .bl.w { background:#FFF1D2; box-shadow:0 0 1vh .3vh rgba(255,226,170,.85), 0 0 3vh .5vh rgba(255,200,120,.32) }
@keyframes xtw { 0%, 30% { opacity:1 } 100% { opacity:.3 } }
/* Glass: the Up next card is frosted and translucent, edged in a thin line of gold, glowing garnet and pine. */
html[data-th="evergreenglow"] .right { background:linear-gradient(160deg, rgba(20,48,34,.55), rgba(10,26,18,.42)) !important;
  border:1px solid rgba(217,180,90,.28) !important;
  box-shadow:inset 0 1px 0 rgba(255,240,210,.18), 0 0 4vh rgba(179,38,58,.18), 0 0 9vh rgba(47,138,87,.14) !important;
  -webkit-backdrop-filter:none !important; backdrop-filter:none !important; animation:none !important }
/* Candlelight on the clock and date. */
html[data-th="evergreenglow"] #clock { text-shadow:0 0 3vh rgba(244,214,140,.24), 0 0 8vh rgba(179,38,58,.16) }
html[data-th="evergreenglow"] #date { color:#E7C982 !important; text-shadow:0 0 2.4vh rgba(231,201,130,.35) !important }
/* The Up next card's bow, bells and snow (placed over the card by xmasPlace). */
#xdeco { position:fixed; left:0; top:0; z-index:3; pointer-events:none; will-change:transform }
#xdeco .xsnow { position:absolute; left:-8px; top:calc(-5vh * .55 + 1px) }
#xdeco .xsnow svg { display:block }
#xdeco .xbells { position:absolute; left:auto; right:-3.4vh; top:.4vh; width:10vh; height:10vh; transform-origin:58% 0; will-change:transform; animation:xswing 3.6s ease-in-out infinite alternate }
#xdeco .xbells svg { width:100%; height:100%; overflow:visible }
@keyframes xswing { from { transform:rotate(-7deg) } to { transform:rotate(7deg) } }
html[data-th="evergreenglow"] body.w-open #xdeco, body.sty-open #xdeco { opacity:0 }
@media (prefers-reduced-motion: reduce) { #xdeco .xbells, #xglow i, #xbokeh i, #xlights .bl { animation:none !important } #xbokeh .fl { display:none } }

.stk { display:inline-block; width:var(--sz, 48px); height:var(--sz, 48px); flex:none; transform:rotate(var(--r0, 0deg)); pointer-events:none }
.stk-a { display:block; width:100%; height:100%; animation:var(--an, none) var(--du, 4s) ease-in-out var(--dl, 0s) infinite; transform-origin:50% 60%; will-change:transform }
.stk svg { display:block; width:100%; height:100%; overflow:visible }
.a-bob { --an:hb-bob } .a-sway { --an:hb-sway; transform-origin:50% 6% } .a-spin { --an:hb-spin; animation-timing-function:linear !important; transform-origin:50% 50% }
.a-twinkle { --an:hb-twinkle; transform-origin:50% 50% } .a-float { --an:hb-float } .a-wiggle { --an:hb-wiggle; transform-origin:50% 85% }
.a-dance { --an:hb-dance; transform-origin:50% 90% } .a-hop { --an:hb-hop; transform-origin:50% 100% } .a-pulse { --an:hb-pulse; transform-origin:50% 55% }
.a-flap { --an:hb-flap; transform-origin:50% 50% } .a-flip { --an:hb-flip; transform-origin:50% 50%; animation-timing-function:linear !important }
:root.deco-still .stk-a { animation:none }
@keyframes hb-bob { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-8%) } }
@keyframes hb-sway { 0%,100% { transform:rotate(-8deg) } 50% { transform:rotate(8deg) } }

<script>/* hb-look:start */
/* ==========================================================================================================

   Source of truth: Home-Base-/tv/page/hb-look.js. page/inject_look.py copies it into the TV page and the wall
   between the "hb-look:start" and "hb-look:end" markers, so both always run the same code.

   What it does
   - Keeps the look settings (L): quick look, part colors, clock & date styles, button glows, press effect, card
     style, the extra background motions and the little characters. Hosts save L wherever they keep settings
     (the wall: config/settings.hbx; the TV: tv_style.hbx) and call HBLook.apply(L).
   - Draws everything with CSS that animates transform and opacity (a few text sheens slide a gradient; Performance
     mode freezes those). One motion language: the same easing and 150 / 250 / 400 ms everywhere.
   - Repeating animations are pinned to the wall clock (HBLook.lock), so a redraw never makes them jump.
   - Builds small live previews for every option, once, and caches them.
   The host tells it which of its elements are the clock, the date, cards and buttons (init), and how its own color

function holThemeById(id) { for (const H of HOLIDAYS) for (const t of H.themes) if (t.id === id) return t; return null; }
/* The holiday whose stretch of days includes d. In February the last days before Fat Tuesday go to Mardi Gras. */
function holidayOn(d) {
  const m = HOLIDAYS.filter(H => H.when(d)); if (!m.length) return null;
  if (m.length > 1 && m.some(H => H.id === 'mardigras') && m.some(H => H.id === 'valentine'))
    return HOLIDAYS.find(H => H.id === (d >= addDays(addDays(easter(d.getFullYear()), -47), -11) ? 'mardigras' : 'valentine'));
  return m[0];
}
function activeHoliday() {
  const s = S.settings, mode = s.holidayMode || 'off';
  if (mode === 'pick') return holThemeById(s.holidayTheme);
  if (mode === 'auto') { const H = holidayOn(today()); return H ? holThemeById((s.holidayFav || {})[H.id]) || H.themes[0] : null; }
